# Réglages de DÉVELOPPEMENT. Copier en docker-compose.override.yaml (ignoré par git) :
# Docker Compose le fusionne automatiquement avec docker-compose.yaml.
#
#   - les images sont CONSTRUITES à partir du code local (build:) au lieu d'être
#     téléchargées depuis ghcr.io → `docker compose up -d --build` ;
#   - l'API recharge le code à chaque modification (--reload + dossier monté) ;
#   - API et PostgreSQL accessibles depuis le poste, sur 127.0.0.1 UNIQUEMENT
#     (jamais 0.0.0.0 : Docker contourne le pare-feu) ;
#   - Caddy et le conteneur frontend ne sont pas démarrés (profil « proxy » jamais
#     activé) : Caddy publie ses ports sur l'IP du VPN 10.8.0.1, qui n'existe pas
#     sur le poste. Le frontend tourne avec Vite (rechargement instantané) :
#       cd frontend && npm install && npm run dev   →  http://localhost:5173
#     Vite transmet /api/* à l'API, comme Caddy en production.
#   Doc interactive de l'API : http://127.0.0.1:8000/docs
#
# Dans le .env du poste : ERP_VERSION=dev (images locales, jamais publiées).

services:
  migrate:
    build: ./backend

  api:
    build: ./backend
    environment:
      ENVIRONMENT: dev
      ROOT_PATH: ""
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: ./backend

  caddy:
    build: ./caddy
    profiles: ["proxy"]

  frontend:
    build: ./frontend
    profiles: ["proxy"]

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
