# Publication d'une version. Déclenché en poussant un tag Git :
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# 1. relance toute la CI (lint, migrations, tests) : rien n'est publié si elle échoue ;
# 2. construit les images et les publie sur le registre GitHub (ghcr.io) :
#      ghcr.io/<propriétaire>/erp-backend:0.1.0   (+ 0.1)
#      ghcr.io/<propriétaire>/erp-caddy:0.1.0     (+ 0.1)
# 3. crée la « Release » GitHub avec les notes générées depuis les commits.
#
# Le serveur déploie ensuite cette version avec : ./server/deploy.sh 0.1.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # droit de publier sur ghcr.io avec le jeton automatique du workflow
    strategy:
      matrix:
        include:
          - image: erp-backend
            context: backend
          - image: erp-caddy
            context: caddy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcule les tags de l'image à partir du tag Git : v0.1.0 → 0.1.0 et 0.1.
      # Ajoute aussi les labels OCI (dont le lien vers le dépôt GitHub).
      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build et publication
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          # Cache des couches Docker entre deux releases (builds beaucoup plus rapides).
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
