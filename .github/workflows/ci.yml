# Intégration continue : à chaque push / pull request, lint + tests + build des images.
# Également appelé par le workflow « Release » : pas de version publiée si la CI échoue.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # PostgreSQL jetable pour les tests d'intégration (RLS, audit, numérotation).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      # Mots de passe jetables, valables uniquement dans ce job.
      ERP_OWNER_PASSWORD: ci_owner
      ERP_APP_PASSWORD: ci_app
      MIGRATION_DATABASE_URL: postgresql+psycopg://erp_owner:ci_owner@localhost:5432/erp
      DATABASE_URL: postgresql+psycopg://erp_app:ci_app@localhost:5432/erp
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://erp_owner:ci_owner@localhost:5432/erp
      TEST_DATABASE_URL: postgresql+psycopg://erp_app:ci_app@localhost:5432/erp
      JWT_SECRET: secret-de-ci-uniquement-0123456789abcdef

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer
        run: pip install ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Créer les rôles PostgreSQL (même script qu'en production)
        run: |
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres PGHOST=localhost POSTGRES_USER=postgres sh ../docker/postgres/init/01-roles.sh

      - name: Migrations (aller, retour, aller) et cohérence modèles ↔ migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest -q

      - name: Build de l'image Docker
        run: docker build -t erp-backend:ci .

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image Caddy (avec le module OVH)
        run: docker build -t erp-caddy:ci caddy
      - name: Vérifier la syntaxe du Caddyfile
        run: >
          docker run --rm
          -e ERP_DOMAIN=erp.example.com -e OVH_ENDPOINT=ovh-eu
          -e OVH_APPLICATION_KEY=x -e OVH_APPLICATION_SECRET=x -e OVH_CONSUMER_KEY=x
          erp-caddy:ci caddy adapt --config /etc/caddy/Caddyfile > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer (versions exactes du package-lock.json)
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint -- --deny-warnings
      - name: Vérification des types et build
        run: npm run build
      - name: Build de l'image Docker
        run: docker build -t erp-frontend:ci .