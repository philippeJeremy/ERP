[project]
name = "erp-backend"
version = "0.1.0"
description = "API de l'ERP (monolithe modulaire FastAPI)"
requires-python = ">=3.13"
# Versions minimales compatibles ; on figera les versions exactes (lock) avant la prod.
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",       # pilote PostgreSQL (synchrone)
    "alembic>=1.20",
    "pydantic-settings>=2.16",    # configuration par variables d'environnement
    "email-validator>=2.3",       # validation des e-mails (EmailStr)
    "python-multipart>=0.0.33",   # formulaire de login OAuth2
    "pyjwt>=2.15",
    "argon2-cffi>=25.1",          # hash des mots de passe (Argon2id)
    "arq>=0.28",                  # tâches de fond sur Redis
    "openpyxl>=3.1",              # lecture des fichiers fournisseurs Excel (.xlsx)
    "xlrd>=2.0",                  # anciens fichiers Excel (.xls)
    "paramiko>=5.0",              # relève des tarifs par SFTP
    "cryptography>=45",           # chiffrement des accès FTP/SFTP des fournisseurs
    "reportlab>=4.2",             # bons de commande PDF
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "httpx>=0.28", "ruff==0.17.4", "pyftpdlib>=2.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends(...) dans les signatures : c'est l'usage normal de FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: test qui a besoin d'un PostgreSQL (TEST_DATABASE_URL)"]
